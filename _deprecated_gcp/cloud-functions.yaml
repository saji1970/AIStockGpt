# Cloud Functions configuration
steps:
  # Deploy backend as Cloud Function
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'functions'
      - 'deploy'
      - 'ai-stock-gpt-backend'
      - '--runtime'
      - 'python311'
      - '--trigger-http'
      - '--allow-unauthenticated'
      - '--entry-point'
      - 'ai_stock_gpt'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--memory'
      - '512MB'
      - '--timeout'
      - '540s'
      - '--set-env-vars'
      - 'PARALLEL_API_KEY=VkvkaHQWl8twbuEhWsgagDp2sNYNdIOuIQMC1NqI'
