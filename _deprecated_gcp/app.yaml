# App Engine configuration for AI Stock GPT
# This will deploy the backend as a Python service

runtime: python311
service: backend

entrypoint: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

instance_class: F1

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  target_throughput_utilization: 0.6

env_variables:
  PARALLEL_API_KEY: "VkvkaHQWl8twbuEhWsgagDp2sNYNdIOuIQMC1NqI"

handlers:
  - url: /.*
    script: auto
    secure: always
